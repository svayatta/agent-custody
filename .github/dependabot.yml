# Dependency updates, weekly, one pull request per ecosystem. Security advisories arrive as soon as GitHub has them
# once Dependabot alerts are enabled in the repository's security settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
    ignore:
      # vitepress-plugin-mermaid declares mermaid 10 || 11 as its peer; take mermaid 12 when the plugin does
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /packages/python
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    ignore:
      # the image tracks the current Node LTS line by hand; a major bump lands when that line changes
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy/gateway
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy/witness
    schedule: { interval: weekly }
