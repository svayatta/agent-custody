# Builds the log server image from deploy/Dockerfile and pushes it to GitHub Container Registry for amd64 and
# arm64, each on a runner of its own architecture (emulating arm64 under QEMU crashes npm with SIGILL), then
# merges the two into one tag. Runs when the release workflow has finished for a version tag (v0.3.0 builds from the
# published npm package of that version, so it waits for the publish), or by hand from the Actions tab with a version.
# Uses the repository's own token; no personal token.
# The first push creates the package as private: make it public once in the package's settings.
name: image

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "published @agent-custody/receipts version to build, e.g. 0.3.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-custody-log

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        env:
          VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: wait for npm to serve the version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: .github/scripts/wait-for-npm.sh "$VERSION"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: deploy
          platforms: ${{ matrix.platform }}
          build-args: AGENT_CUSTODY_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=agent-custody reference log server
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: record the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" | sed 's/^sha256://' > "/tmp/digests/$(echo '${{ matrix.platform }}' | tr / -)"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: v
        env:
          VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.v.outputs.version }}" -t "$IMAGE:latest" \
            $(for f in *; do printf '%s@sha256:%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.version }}"
