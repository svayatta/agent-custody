# Builds the log server image from deploy/Dockerfile and pushes it to GitHub Container Registry for amd64 and
# arm64, each on a runner of its own architecture (emulating arm64 under QEMU crashes npm with SIGILL), then
# merges the two into one tag and signs it. Runs when the release workflow has finished for a version tag (v0.3.0
# builds from the published npm package of that version, so it waits for the publish), or by hand from the Actions
# tab with a version. A pull request that touches deploy/ checks the deploy files and builds and smoke-tests the
# image from the workspace package, so a broken image is found before the release and not after it.
# Every pushed image carries a provenance attestation and an SBOM and is signed with cosign, keyless, by this
# workflow's identity (deploy/README.md says how to verify one). Uses the repository's own token; no personal token.
# The first push creates the package as private: make it public once in the package's settings.
name: image

on:
  pull_request:
    paths:
      - "deploy/**"
      - "packages/receipts/src/cli.ts"
      - ".github/workflows/image.yml"
      - ".github/scripts/**"
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "published @agent-custody/receipts version to build, e.g. 0.3.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-custody-log

jobs:
  config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: the compose file is valid with its required secrets set
        env:
          POSTGRES_PASSWORD: ci
          SIGNER_TOKEN: ci
        run: docker compose -f deploy/docker-compose.yaml --profile public --profile file config -q
      - name: the witness compose file is valid with its required settings set
        env:
          WITNESS_LOG_URL: https://log.example.com/
          WITNESS_CHECKPOINTS_URL: https://checkpoints.example.com/
          WITNESS_HOST: witness.example.org
        run: docker compose -f deploy/witness/docker-compose.yaml config -q
      - run: kubectl kustomize deploy/k8s > /dev/null
      - run: shellcheck -S warning deploy/*.sh
      - name: upgrade.sh deploys the release tag and rolls back
        run: deploy/test-upgrade.sh

  verify:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pack the package from this checkout
        run: |
          bun install --frozen-lockfile
          bun run --filter @agent-custody/receipts build
          (cd packages/receipts && bun pm pack --destination "$GITHUB_WORKSPACE/deploy/pkg")
      - run: docker build -t log-smoke:local deploy
      - run: deploy/smoke-log.sh log-smoke:local

  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/tags/v{0}', github.event.inputs.version) }}
      - id: v
        env:
          VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: |
          version="${VERSION#v}"
          .github/scripts/require-release-commit.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: wait for npm to serve the version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: .github/scripts/wait-for-npm.sh "$VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build and smoke-test this platform's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy
          platforms: ${{ matrix.platform }}
          build-args: AGENT_CUSTODY_VERSION=${{ steps.v.outputs.version }}
          load: true
          tags: log-smoke:local
      - run: deploy/smoke-log.sh log-smoke:local
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy
          platforms: ${{ matrix.platform }}
          build-args: AGENT_CUSTODY_VERSION=${{ steps.v.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=agent-custody reference log server
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.v.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p /tmp/digests
          echo "${DIGEST#sha256:}" > "/tmp/digests/$(echo "$PLATFORM" | tr / -)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - id: v
        env:
          VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: one tag for both architectures
        working-directory: /tmp/digests
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          refs=""
          for f in *; do refs="$refs $IMAGE@sha256:$(cat "$f")"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" $refs
      - name: sign the image and record its digest
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          { echo "### $IMAGE"; echo; echo "\`$IMAGE@$digest\`"; } >> "$GITHUB_STEP_SUMMARY"
