# Publishes the packages when a version tag is pushed: v0.1.3 publishes @agent-custody/receipts, @agent-custody/state,
# and agent-custody on PyPI, all at that version. No tokens: npm and PyPI trust this workflow through OIDC ("trusted
# publishing"), which each registry must be told about once, in the package's settings, before the first tagged release.
# Until that is done, releases are published by hand and only the check job runs here: set the repository variable
# PUBLISH_FROM_CI to "true" once both registries list this workflow as a trusted publisher, and every tag from then on
# publishes with provenance attestations and no long-lived token anywhere.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: tag must match every package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in packages/receipts/package.json packages/state/package.json; do
            pv=$(node -p "require('./$f').version"); [ "$pv" = "$v" ] || { echo "$f is $pv, tag is $v"; exit 1; }
          done
          pyv=$(grep -m1 '^version' packages/python/pyproject.toml | sed 's/.*"\(.*\)"/\1/'); [ "$pyv" = "$v" ] || { echo "pyproject is $pyv, tag is $v"; exit 1; }
      - name: deploy files and the monitor name this version
        run: .github/scripts/check-deploy-versions.sh "${GITHUB_REF_NAME#v}"
      - run: bun run typecheck
      - run: bun run test

  npm:
    needs: check
    if: vars.PUBLISH_FROM_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later; the version is pinned like every action in this file
      - run: npm install -g npm@11.21.1
      - run: bun install --frozen-lockfile
      # one after the other: state imports receipts from its dist, and a parallel build can reach it first
      - run: bun run --filter @agent-custody/receipts build
      - run: bun run --filter @agent-custody/state build
      - name: pack with bun so workspace versions are rewritten
        run: |
          (cd packages/receipts && bun pm pack)
          (cd packages/state && bun pm pack)
      - run: npm publish packages/receipts/agent-custody-receipts-*.tgz --access public --provenance
      - run: npm publish packages/state/agent-custody-state-*.tgz --access public --provenance

  pypi:
    needs: check
    if: vars.PUBLISH_FROM_CI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python/dist
