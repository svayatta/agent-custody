<circle r="6" fill="#7F77DD" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M175 228 L245 228" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.2133;0.2333;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2130;0.2133;0.2333;0.2337;1.0000" values="0;0;1;1;0;0"/></circle>
