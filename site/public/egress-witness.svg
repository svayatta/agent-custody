<polyline points="340,256 340,310" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2417;0.2617;1.0000" values="0;0;1;1"/></polyline>
<circle r="6" fill="#888780" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M340 256 L340 310" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.2417;0.2617;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2413;0.2417;0.2617;0.2620;1.0000" values="0;0;1;1;0;0"/></circle>
<text x="24" y="433" font-size="14" font-weight="600" fill="#2C2C2A">2  Direct call to the provider: refused</text>
<text x="24" y="454" font-size="12" fill="#5F5E5A">CONNECT api.stripe.com:443 has no permit: 403, nothing opened, a denial receipt is logged.</text>
</g>
