<circle r="6" fill="#1D9E75" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M435 228 L495 228" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.4417;0.4617;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4413;0.4417;0.4617;0.4620;1.0000" values="0;0;1;1;0;0"/></circle>
<polyline points="340,256 340,310" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4700;0.4900;1.0000" values="0;0;1;1"/></polyline>
<circle r="6" fill="#888780" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M340 256 L340 310" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.4700;0.4900;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4697;0.4700;0.4900;0.4903;1.0000" values="0;0;1;1;0;0"/></circle>
<text x="24" y="433" font-size="14" font-weight="600" fill="#2C2C2A">3  Permitted destination: relayed, never read</text>
<text x="24" y="454" font-size="12" fill="#5F5E5A">An opaque TLS tunnel. The receipt records where, when, and how many bytes, never the payload.</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6000;0.6083;0.7917;0.8000;1.0000" values="0;0;1;1;0;0"/>
