<polyline points="340,256 340,310" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6417;0.6617;1.0000" values="0;0;1;1"/></polyline>
<circle r="6" fill="#888780" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M340 256 L340 310" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.6417;0.6617;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6413;0.6417;0.6617;0.6620;1.0000" values="0;0;1;1;0;0"/></circle>
<text x="24" y="433" font-size="14" font-weight="600" fill="#2C2C2A">4  No proxy credential: refused</text>
<text x="24" y="454" font-size="12" fill="#5F5E5A">The witness cannot name the agent, so it answers 407 in every mode. The receipt says unknown.</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.8000;0.8083;0.9917;1.0000;1.0000" values="0;0;1;1;0;0"/>
<polyline points="175,250 199,250" fill="none" stroke="#D85A30" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="24.0" stroke-dashoffset="24.0"><animate attributeName="stroke-dashoffset" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8133;0.8333;1.0000" values="24.0;24.0;0;0"/></polyline>
<circle r="6" fill="#D85A30" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M175 250 L199 250" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.8133;0.8333;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8130;0.8133;0.8333;0.8337;1.0000" values="0;0;1;1;0;0"/></circle>
<g opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8333;0.8383;1.0000" values="0;0;1;1"/><circle cx="200" cy="250" r="11" fill="#E24B4A"/><path d="M196 246L204 254M204 246L196 254" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="24" y="433" font-size="14" font-weight="600" fill="#2C2C2A">5  Agent ignores HTTPS_PROXY: dropped by lockdown</text>
<text x="24" y="454" font-size="12" fill="#5F5E5A">The NetworkPolicy drops it at the pod. No receipt: without lockdown it would leave unseen.</text>
</g>
