<text x="240" y="74" font-size="14" font-weight="600" fill="#2C2C2A">agent-custody-gateway</text>
<rect x="196" y="50" width="8" height="340" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="110" y="300" text-anchor="middle" font-size="12" fill="#712B13">Default-deny egress</text><text x="110" y="318" text-anchor="middle" font-size="12" fill="#712B13">NetworkPolicy, firewall</text>
<rect x="55" y="200" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="115.0" y="222.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Agent pod</text>
<text x="115.0" y="241.0" text-anchor="middle" font-size="12" fill="#534AB7">egress: locked</text>
<rect x="245" y="90" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340.0" y="112.0" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Gateway</text>
<text x="340.0" y="131.0" text-anchor="middle" font-size="12" fill="#0F6E56">Holds tool credentials</text>
<rect x="245" y="200" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340.0" y="222.0" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Egress witness</text>
<text x="340.0" y="241.0" text-anchor="middle" font-size="12" fill="#0F6E56">Cedar per host:port</text>
<rect x="245" y="310" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="340.0" y="332.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Receipts and log</text>
<text x="340.0" y="351.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Signed, Merkle log</text>
<text x="577" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Internet</text>
<rect x="495" y="90" width="165" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="577.5" y="112.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">api.stripe.com</text>
<text x="577.5" y="131.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Payment provider</text>
<rect x="495" y="200" width="165" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="577.5" y="222.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">registry.npmjs.org</text>
<text x="577.5" y="241.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Permitted by policy</text>
<rect x="495" y="310" width="165" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="577.5" y="332.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Any other host</text>
<text x="577.5" y="351.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Direct route</text>
