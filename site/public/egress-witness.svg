<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-labelledby="t d">
<title id="t">The egress witness: how a locked-down agent reaches the outside</title>
<desc id="d">An agent pod with default-deny egress can reach only the gateway and the egress witness. Five cases loop: a tool call through the gateway; a direct call to Stripe refused by the witness with a receipt; a permitted host relayed as an opaque tunnel with a receipt of bytes and times; a connection with no proxy credential refused with 407; and a connection that ignores the proxy, dropped by the NetworkPolicy with no receipt.</desc>
