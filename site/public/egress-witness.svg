<polyline points="435,134 448,134 448,338 435,338" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0837;0.1288;1.0000" values="0;0;1;1"/></polyline>
<circle r="6" fill="#888780" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M435 134 L448 134 L448 338 L435 338" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.0837;0.1288;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0834;0.0837;0.1288;0.1292;1.0000" values="0;0;1;1;0;0"/></circle>
<text x="24" y="433" font-size="14" font-weight="600" fill="#2C2C2A">1  Tool call through the gateway</text>
<text x="24" y="454" font-size="12" fill="#5F5E5A">The gateway holds the Stripe key, decides the call on its arguments, and receipts it.</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2000;0.2083;0.3917;0.4000;1.0000" values="0;0;1;1;0;0"/>
