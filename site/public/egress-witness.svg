<circle r="6" fill="#7F77DD" opacity="0"><animateMotion dur="30.0s" repeatCount="indefinite" path="M175 244 L245 244" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.6133;0.6333;1.0000"/><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6130;0.6133;0.6333;0.6337;1.0000" values="0;0;1;1;0;0"/></circle>
