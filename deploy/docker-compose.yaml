# The log, run by someone who is not the agent's operator. Today: the reference log server, single tenant,
# file-backed, with the signing key on a volume. The service names, environment variables, and volumes are the
# same contract the Kubernetes manifests in deploy/k8s use, so a deployment moves between them without a rewrite.
#
#   docker compose up -d                       the log and its Postgres on port 8787, private (behind your own TLS or VPN)
#   docker compose --profile public up -d      the same behind Caddy with automatic TLS on LOG_HOST
#   docker compose --profile file up -d        the file-backed log alone, no Postgres, for a single-tenant second machine
#
# Copy .env.example to .env first.

name: agent-custody

services:
  signer:
    # The one process that holds the log's key. Reachable only from the log on the compose network.
    build:
      context: .
      args:
        AGENT_CUSTODY_VERSION: ${AGENT_CUSTODY_VERSION:-0.6.3}
    image: ghcr.io/svayatta/agent-custody-log:${AGENT_CUSTODY_VERSION:-0.6.3}
    restart: unless-stopped
    environment:
      ROLE: signer
      AGENT_CUSTODY_LOG_KEY: /data/keys/log.key
      AGENT_CUSTODY_SIGNER_PORT: "8790"
      SIGNER_TOKEN: "${SIGNER_TOKEN:?set SIGNER_TOKEN in .env (openssl rand -hex 32)}"
    volumes:
      - logdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8790/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  log:
    depends_on:
      postgres:
        condition: service_healthy
      signer:
        condition: service_healthy
    build:
      context: .
      args:
        AGENT_CUSTODY_VERSION: ${AGENT_CUSTODY_VERSION:-0.3.0}
    image: ghcr.io/svayatta/agent-custody-log:${AGENT_CUSTODY_VERSION:-0.6.3}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_CUSTODY_LOG_FILE: /data/log.jsonl
      AGENT_CUSTODY_LOG_KEY: /data/keys/log.key
      AGENT_CUSTODY_LOG_PORT: "8787"
      AGENT_CUSTODY_LOG_ID: ${AGENT_CUSTODY_LOG_ID:-}
      # tenants, tokens, leaves, and checkpoints in Postgres; the volume keeps the pre-import file log
      DATABASE_URL: postgres://custody:${POSTGRES_PASSWORD:-}@postgres:5432/custody_log
      # the key is in the signer; this process never holds it
      AGENT_CUSTODY_SIGNER_URL: http://signer:8790/
      SIGNER_TOKEN: "${SIGNER_TOKEN:-}"
      # checkpoints as files for the checkpoints host, every five minutes
      AGENT_CUSTODY_CHECKPOINT_DIR: /checkpoints
      AGENT_CUSTODY_CHECKPOINT_EVERY: "${AGENT_CUSTODY_CHECKPOINT_EVERY:-300}"
      AGENT_CUSTODY_CHECKPOINT_HEARTBEAT: "${AGENT_CUSTODY_CHECKPOINT_HEARTBEAT:-21600}"
      # the operator's page at /admin, behind this token; the hosts fill the welcome sheet in
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Caddy is the only way in from outside, and it sets X-Forwarded-For; the log is on loopback otherwise
      TRUST_PROXY: "1"
      # a log run for other people accepts leaf hashes only; the file profile, for a machine of your own, does not set it
      AGENT_CUSTODY_HASH_ONLY: "${AGENT_CUSTODY_HASH_ONLY:-1}"
      LOG_HOST: "${LOG_HOST:-}"
      CHECKPOINTS_HOST: "${CHECKPOINTS_HOST:-}"
    volumes:
      - logdata:/data
      - checkpoints:/checkpoints
    ports:
      # bound to loopback: the host may reach it, the internet may not; the public profile adds Caddy in front
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/head"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The tenant portal: registration, first key, usage against plan, keys, billing, export. Same image, its own
  # tables on the same Postgres. Public through Caddy at PORTAL_HOST; on loopback otherwise.
  portal:
    depends_on:
      postgres:
        condition: service_healthy
    image: ghcr.io/svayatta/agent-custody-log:${AGENT_CUSTODY_VERSION:-0.6.3}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ROLE: portal
      DATABASE_URL: postgres://custody:${POSTGRES_PASSWORD:-}@postgres:5432/custody_log
      PORTAL_SECRET: "${PORTAL_SECRET:-}"
      LOG_HOST: "${LOG_HOST:-}"
      CHECKPOINTS_HOST: "${CHECKPOINTS_HOST:-}"
      PORTAL_HOST: "${PORTAL_HOST:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_TEAM: "${STRIPE_PRICE_TEAM:-}"
      MAIL_API_KEY: "${MAIL_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_NOTIFY: "${MAIL_NOTIFY:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8792:8792"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8792/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # docs.<domain>: the site built from this checkout, served as static files behind Caddy at DOCS_HOST.
  # `deploy/update-docs.sh` rebuilds it after a git pull.
  docs:
    profiles: ["public"]
    build:
      context: ..
      dockerfile: deploy/docs.Dockerfile
    image: agent-custody-docs:local
    # built here, never pulled: keeps `docker compose pull` from failing on an image no registry has
    pull_policy: build
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      log:
        condition: service_healthy
    environment:
      # required only with --profile public; Caddy refuses to start without a host
      LOG_HOST: ${LOG_HOST:-}
      # the second host: the published checkpoints, served as static files so they survive an outage of the log's API
      CHECKPOINTS_HOST: ${CHECKPOINTS_HOST:-}
      # every host block in the Caddyfile has a *.localhost default, so an unset host is harmless, never a crash
      PORTAL_HOST: ${PORTAL_HOST:-}
      DOCS_HOST: ${DOCS_HOST:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites.d:/etc/caddy/sites.d:ro  # other sites on this host (Caddyfile, last line)
      - caddy_data:/data
      - caddy_config:/config
      - checkpoints:/srv/checkpoints:ro

  postgres:
    # The store for leaves (as hashes), tenants, and hashed tokens; one writer per tenant is enforced inside it.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: custody_log
      POSTGRES_USER: custody
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custody -d custody_log"]
      interval: 10s
      timeout: 3s
      retries: 5

  log-file:
    # The file-backed reference server alone: one tenant, no Postgres. What deploy/ was before phase 2.
    profiles: ["file"]
    image: ghcr.io/svayatta/agent-custody-log:${AGENT_CUSTODY_VERSION:-0.6.3}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_CUSTODY_LOG_FILE: /data/log.jsonl
      AGENT_CUSTODY_LOG_KEY: /data/keys/log.key
      AGENT_CUSTODY_LOG_PORT: "8787"
      AGENT_CUSTODY_LOG_ID: ${AGENT_CUSTODY_LOG_ID:-}
    volumes:
      - logdata:/data
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  checkpoints:
  logdata:
  caddy_data:
  caddy_config:
  pgdata:
