# One shared agent-custody gateway for every agent on this host or network: all their tool calls go through it, each
# connection presents its own grant, and the tool credentials live here and never in an agent.
#
#   mkdir config && sudo chown 10001:10001 config && docker compose --profile init run --rm init     a starter config, policy, and a demo grant in ./config
#   docker compose up -d                                              the gateway on 127.0.0.1:8790, plain HTTP
#   docker compose --profile tls up -d                                the same behind Caddy with automatic TLS on GATEWAY_HOST
#   docker compose --profile console up -d                            the admin console on 127.0.0.1:8795 (needs ./console-token: see the secret below)
#
# The transport is plain HTTP and a grant is a bearer credential: keep the port on loopback or a private network, or
# put the tls profile (or your own proxy or mesh) in front. Copy .env.example to .env and set AGENT_CUSTODY_GATEWAY_VERSION.

name: agent-custody-gateway

services:
  gateway:
    image: ghcr.io/svayatta/agent-custody-gateway:${AGENT_CUSTODY_GATEWAY_VERSION:?set AGENT_CUSTODY_GATEWAY_VERSION in .env to a release version}
    restart: unless-stopped
    # the gateway and the console run as the same user, so what one writes the other can read: the gateway's key is mode 0600
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    # tool credentials and the log token come from the environment, never from gateway.json. The console's token is not in
    # this file: it is a secret that only the console service is given
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/config:ro
      - ${GATEWAY_DATA:-gateway-data}:/data
    environment:
      # the port inside the container is fixed; GATEWAY_PORT in .env is the host port only, and env_file would otherwise
      # change the port the gateway and its health check use and leave the published mapping pointing at 8790
      GATEWAY_PORT: "8790"
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8790}:8790"
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  console:
    # the admin console for this gateway: config, tools, receipts, policy editing with replay, grant revocation. A service of
    # its own, not part of the gateway, so that the gateway never serves an admin page next to the agents' credentials, and
    # never holds the token that can rewrite its policy: the token is a secret mounted only here, and this service is not given
    # the gateway's .env, so it holds none of the upstream credentials either. It reads and writes the same config and data as
    # the gateway, so ./config is mounted read-write here (the policy file is what it edits). Keep the port on loopback or a
    # private network and put TLS in front.
    profiles: [console]
    image: ghcr.io/svayatta/agent-custody-gateway:${AGENT_CUSTODY_GATEWAY_VERSION:?set AGENT_CUSTODY_GATEWAY_VERSION in .env to a release version}
    command: ["console"]
    restart: unless-stopped
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    environment:
      GATEWAY_URL: "http://gateway:8790"
    secrets:
      - console_token
    volumes:
      - ./config:/config
      - ${GATEWAY_DATA:-gateway-data}:/data
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-8795}:8795"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8795/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gateway

  init:
    # one-off: writes a starter config into ./config, which must be writable by the user below
    profiles: [init]
    image: ghcr.io/svayatta/agent-custody-gateway:${AGENT_CUSTODY_GATEWAY_VERSION:?set AGENT_CUSTODY_GATEWAY_VERSION in .env to a release version}
    command: ["init"]
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    volumes:
      - ./config:/config
    environment:
      DATA_DIR: /data

  caddy:
    profiles: [tls]
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # GATEWAY_HOST is the DNS name that points at this host; Caddy gets its certificate for it
    command: ["caddy", "reverse-proxy", "--from", "${GATEWAY_HOST:-localhost}", "--to", "gateway:8790"]
    volumes:
      - caddy-data:/data
    depends_on:
      - gateway

secrets:
  console_token:
    # openssl rand -hex 32 > console-token && chmod 600 console-token
    file: ${CONSOLE_TOKEN_FILE:-./console-token}

volumes:
  gateway-data:
  caddy-data:
