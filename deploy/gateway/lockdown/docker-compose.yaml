# Egress lockdown for agents on one docker host: an override for ../docker-compose.yaml. The agent sits on an internal
# network with no route out; the gateway and the egress witness sit on it and on the default network, so the only ways
# out are a tool call through the gateway (which holds the tool credentials) and a connection through the witness
# (which decides it by policy and receipts it). Without this, HTTPS_PROXY is advice an agent can ignore.
#
#   docker compose -f docker-compose.yaml -f lockdown/docker-compose.yaml run --rm egress keygen --dir /data/keys --name egress
#   docker compose -f docker-compose.yaml -f lockdown/docker-compose.yaml --profile demo-agent up -d
#
# Set EGRESS_SECRET_RESEARCH_AGENT in .env (openssl rand -hex 32), and the same value in the agent's HTTPS_PROXY. The
# `agent` service is a stand-in: replace its image and entrypoint with your agent's, keep its network, proxy, and
# NO_PROXY settings. The witness needs a release that has `agent-custody egress`.
#
# What this does not cover: a connection the witness relays is opaque to it (no TLS interception), so it records where
# traffic went and how much, never what was sent. Docker's embedded DNS still answers on the internal network.
#
# Internal destinations: the witness sits on `default`, so it has a route to the host, the other compose services, the
# private ranges, and the cloud metadata address, which the agent does not. Compose has no equivalent of the Kubernetes
# exception list. The witness itself refuses to dial a loopback, private, link-local, or metadata address for a host
# name, before it connects; an IP literal is dialled only when the policy names that address as the action. Do not
# permit internal addresses, and on a cloud VM block the metadata address for this container in the host firewall too.

services:
  gateway:
    networks: [agents, default]

  egress:
    image: ghcr.io/svayatta/agent-custody-gateway:${AGENT_CUSTODY_GATEWAY_VERSION:?set AGENT_CUSTODY_GATEWAY_VERSION in .env to a release version}
    command: ["egress", "--config", "/egress/egress.json", "--host", "0.0.0.0", "--port", "8791"]
    restart: unless-stopped
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    # only the agents' proxy secrets: the witness holds no tool credential
    environment:
      EGRESS_SECRET_RESEARCH_AGENT: ${EGRESS_SECRET_RESEARCH_AGENT:-}
    volumes:
      - ./lockdown/config:/egress:ro
      - egress-data:/data
    networks: [agents, default]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  agent:
    # a stand-in agent: `docker compose ... exec agent node -e "fetch('https://api.stripe.com').catch(e => console.log(e.cause))"`
    # is refused by the witness, and a fetch that ignores the proxy has no route at all
    profiles: [demo-agent]
    image: ghcr.io/svayatta/agent-custody-gateway:${AGENT_CUSTODY_GATEWAY_VERSION:?set AGENT_CUSTODY_GATEWAY_VERSION in .env to a release version}
    entrypoint: ["node", "-e", "setInterval(() => {}, 1 << 30)"]
    environment:
      HTTPS_PROXY: http://research-agent:${EGRESS_SECRET_RESEARCH_AGENT:-}@egress:8791
      HTTP_PROXY: http://research-agent:${EGRESS_SECRET_RESEARCH_AGENT:-}@egress:8791
      # the gateway is reached directly; its calls are receipted by the gateway itself
      NO_PROXY: gateway
      NODE_USE_ENV_PROXY: "1"
      AGENT_CUSTODY_GATEWAY_URL: http://gateway:8790/mcp
    networks: [agents]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  agents:
    # no gateway to the outside: a container only on this network reaches only its peers
    internal: true

volumes:
  egress-data:
