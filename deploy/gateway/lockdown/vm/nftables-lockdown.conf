# A drop-in for nftables.service, for hosts where that service is installed (Debian, Ubuntu, Fedora):
#
#   sudo install -D -m 0644 nftables-lockdown.conf /etc/systemd/system/nftables.service.d/agent-custody-lockdown.conf
#   sudo systemctl daemon-reload
#
# Every start and every reload of nftables.service runs /etc/nftables.conf, which on Debian and Ubuntu starts with
# `flush ruleset` and so deletes the agent_custody_lockdown table. agent-custody-lockdown.service stays active through
# that (it is a oneshot), and only a stop or restart of nftables reaches it (PartOf=). These lines load the table again
# right after the flush. If that load fails, they stop agent-custody-lockdown.service, which stops every agent that
# requires it, so an agent never runs on its systemd drop-in alone. They do not fail nftables.service itself: the host's
# own rules are loaded by then.
[Service]
ExecStartPost=/bin/sh -c '/usr/sbin/nft -f /etc/agent-custody/agent-lockdown.nft || systemctl --no-block stop agent-custody-lockdown.service'
# appended to the service's own ExecReload, so it runs after the reload's flush
ExecReload=/bin/sh -c '/usr/sbin/nft -f /etc/agent-custody/agent-lockdown.nft || systemctl --no-block stop agent-custody-lockdown.service'
