# Egress lockdown for an agent that runs as a systemd service: a drop-in for the agent's own unit. It runs the agent as
# the user that agent-lockdown.nft names, and lets the unit's processes reach only the gateway and the egress witness.
#
#   (first agent-lockdown.nft and agent-custody-lockdown.service, as their headers say)
#   sudo install -D -m 0644 agent-lockdown.conf /etc/systemd/system/<your-agent>.service.d/lockdown.conf
#   sudo install -m 0600 /dev/null /etc/agent-custody/agent.env        # then write the settings listed below into it
#   sudo systemctl daemon-reload && sudo systemctl restart <your-agent>
#   sudo ./check-lockdown.sh --unit <your-agent>.service
#
# Use it with agent-lockdown.nft, not instead of it. The two hold different things:
#   - The nftables rule matches the agent's user, so it covers whatever that user runs, and it matches ports.
#   - These settings match the unit, so they hold even if the host firewall is flushed or never loaded. But
#     IPAddressAllow= takes addresses only, not ports: allowing 127.0.0.1 for the gateway allows every service that
#     listens on 127.0.0.1. Only the nftables rule narrows that to 8790 and 8791.
# IPAddressDeny= needs cgroup BPF in the kernel. Where it is missing, systemd logs "Proceeding WITHOUT firewalling in
# effect!" once and starts the unit without the filter, so run check-lockdown.sh with --unit after every change.

[Unit]
# The agent starts only once agent-custody-lockdown.service has loaded agent-lockdown.nft, and stops with it. If the load
# fails, the agent stays down rather than run with this drop-in alone, which allows every port on 127.0.0.1. Do not
# depend on nftables.service: starting it runs /etc/nftables.conf, which on Debian and Ubuntu flushes every table.
Requires=agent-custody-lockdown.service
After=agent-custody-lockdown.service

[Service]
# the user named in agent-lockdown.nft; it owns nothing but the agent's own files
User=agent
# no setuid program can make the agent another user, which the nftables rule would no longer match
NoNewPrivileges=true
# Both firewalls see IP only. Other socket families are refused, among them vsock (systemd makes /dev/vsock 0666, and
# the hypervisor answers on it), packet, and Bluetooth sockets. Netlink stays: it reaches only the local kernel.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# The agent's settings, in a file only root can read (each value holds the agent's proxy secret):
#   HTTPS_PROXY=http://research-agent:<secret>@127.0.0.1:8791
#   HTTP_PROXY=http://research-agent:<secret>@127.0.0.1:8791
#   NO_PROXY=127.0.0.1                 # the gateway is reached directly; it receipts its own calls
#   NODE_USE_ENV_PROXY=1               # Node's fetch reads the proxy variables only with this
#   AGENT_CUSTODY_GATEWAY_URL=http://127.0.0.1:8790/mcp
EnvironmentFile=/etc/agent-custody/agent.env

# Deny every address, then allow back the gateway and the witness (both on 127.0.0.1 with the shipped units). Change
# it to match agent-lockdown.nft, which by default allows no resolver either: an agent that reaches the gateway and the
# witness by address needs no DNS (the witness resolves every other name). If yours does, uncomment the resolver lines
# in agent-lockdown.nft and add the same address here. Use one on loopback (127.0.0.53, the systemd-resolved stub),
# never 1.1.1.1 or a VPC resolver: an allow here opens every port on that address.
IPAddressDeny=any
IPAddressAllow=127.0.0.1
