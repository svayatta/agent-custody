# Stock Envoy in front of a site, asking the agent-custody door about every request (ext_authz, HTTP mode). The door
# answers 200 (allow) or 403 (deny) and writes a receipt either way; Envoy relays an allowed request to the origin
# itself, so the door never sees the body or the origin's answer, and its receipts record the decision, not the result.
# Rename the clusters to your own; the door runs with "authz": true and "trustProxy": true (door.json here).
static_resources:
  listeners:
  - name: site
    address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: site
          # the arrival's address is the peer's, not whatever the client wrote in X-Forwarded-For
          use_remote_address: true
          route_config:
            virtual_hosts:
            - name: site
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: origin }
                # the grant and the declared name are for the door, not the origin
                request_headers_to_remove: [x-agent-custody-grant, x-agent-custody-agent]
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              # the door down, or slow past the timeout, is a refusal
              failure_mode_allow: false
              # the client headers the door reads; Envoy sends no other client header to it
              allowed_headers:
                patterns:
                - { exact: authorization }
                - { exact: x-agent-custody-grant }
                - { exact: x-agent-custody-agent }
                - { exact: x-agent-custody-challenge }
                - { exact: signature-input }
                - { exact: signature }
                - { exact: signature-agent }
                - { exact: user-agent }
                - { exact: accept }
                - { exact: content-type }
                # read only with `behaviour` in the door config; add the `behaviour.tlsHeader` header here when you set one
                - { exact: referer }
                - { exact: sec-fetch-site }
                - { exact: sec-fetch-mode }
                - { exact: sec-fetch-dest }
                - { exact: sec-fetch-user }
                - { exact: sec-ch-ua }
                - { exact: origin }
                - { exact: x-agent-custody-form }
              http_service:
                server_uri: { uri: "http://door:8780", cluster: door, timeout: 5s }
                path_prefix: /_agent_custody
                authorization_request:
                  # the door decides on the original request: these headers, set here, never the client's own copies
                  headers_to_add:
                  - { key: x-original-method, value: "%REQ(:METHOD)%" }
                  - { key: x-original-uri, value: "%REQ(:PATH)%" }
                  - { key: x-forwarded-for, value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" }
                authorization_response:
                  # on an allow, the origin gets the door's receipt id and class, replacing anything the client sent
                  allowed_upstream_headers:
                    patterns: [{ exact: x-agent-custody-receipt }, { exact: x-agent-custody-class }]
                  # and the client is told which receipt recorded the decision (a refusal carries the door's whole answer)
                  allowed_client_headers_on_success:
                    patterns: [{ exact: x-agent-custody-receipt }, { exact: x-agent-custody-class }]
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
  - name: door
    type: STRICT_DNS
    connect_timeout: 2s
    load_assignment: { cluster_name: door, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: door, port_value: 8780 } } } }] }] }
  - name: origin
    type: STRICT_DNS
    connect_timeout: 2s
    load_assignment: { cluster_name: origin, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: origin, port_value: 8081 } } } }] }] }
