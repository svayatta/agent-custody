# The agent-custody door as a Cloudflare Worker. Variables only: the signing key and the log token are secrets, set
# with `wrangler secret put DOOR_KEY` and `wrangler secret put LOG_TOKEN`, never written here. README.md has the steps.
name = "agent-custody-door"
main = "dist/index.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# The bundle is built by the door's own build script, which is also what the tests run: one ES module and the Cedar
# WebAssembly beside it.
no_bundle = true

# Put the Worker in front of the site. Uncomment and set your zone; a subrequest from a Worker to its own zone goes to
# the origin, so ORIGIN_URL may be the site's own hostname. It stays above [build]: TOML puts a key below a table
# header into that table, and the Worker would then have no route.
# routes = [{ pattern = "shop.example.com/*", zone_name = "example.com" }]

[build]
command = "node ../../../packages/receipts/scripts/build-door-worker.ts dist"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Every minute, append the receipts whose log append failed and were kept in the bucket's outbox.
[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "agent-custody-door-receipts"

# Web Bot Auth nonces: one Durable Object per agent, key id, and nonce, reached by every isolate, so a signature replayed
# to another isolate or location is refused. Needed when DOOR_CONFIG has webBotAuth. `wrangler deploy` creates the class.
[[durable_objects.bindings]]
name = "NONCES"
class_name = "DoorNonce"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DoorNonce"]

[vars]
ORIGIN_URL = "https://shop.example.com"
# Your tenant on the hosted log, and the hosted log's public key (curl https://log.agent-custody.dev/.well-known/agent-custody-log.json).
# The hosted log is run by someone other than the site, so it is sent leaf hashes only: it never holds a receipt.
LOG_URL = "https://log.agent-custody.dev/t/YOUR-TENANT/"
LOG_HASH_ONLY = "true"
# The log id every tree head must name, if your log writes one: an answer for another log is then refused.
# LOG_ID = "YOUR-TENANT"
LOG_KEYS = """
-----BEGIN PUBLIC KEY-----
REPLACE WITH THE LOG'S PUBLIC KEY
-----END PUBLIC KEY-----
"""
# The principal keys whose grants this door accepts as a passport, SPKI PEM, one or more. Empty: no grant is trusted.
TRUSTED_PRINCIPAL_KEYS = ""
# Agent registry keys, SPKI PEM, from the registry's /.well-known/agent-custody-registry.json. With them, an agent that
# presents the registry's passport and signs with its did:key is verified; needs webBotAuth in DOOR_CONFIG. Empty: none.
# To bind each key to the registry it speaks for, give a JSON list instead: [{ "publicKeyPem": "...", "registry": "https://..." }].
TRUSTED_REGISTRY_KEYS = ""
# The site's admission lists, the JSON of a door's admissionLists file: { "lists": { "partners": [ ... ] } }. Unset: no lists.
# ADMISSION_LISTS = '{ "lists": {} }'
# Digests of revoked grants, as `agent-custody revoke` writes them.
REVOKED_GRANTS = "[]"
DOOR_POLICY = """
// Anyone may read the catalogue. Only an agent with a grant for "orders" may place an order.
permit(principal, action == Action::"catalogue", resource);
permit(principal, action == Action::"orders", resource)
  when { context.facts.arrival.class == "verified" };
"""
DOOR_CONFIG = """
{
  "routes": [
    { "name": "catalogue", "path": "/products/*", "methods": ["GET", "HEAD"] },
    { "name": "orders", "path": "/orders", "methods": ["POST"] }
  ],
  "precommit": ["orders"]
}
"""
