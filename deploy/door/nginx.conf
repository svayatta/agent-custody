# Stock nginx in front of a site, asking the agent-custody door about every request (auth_request). The door answers
# 200 (allow) or 403 (deny) and writes a receipt either way; nginx relays an allowed request to the origin itself, so
# the door never sees the body or the origin's answer, and its receipts record the decision, not the result.
# Rename the upstreams to your own; the door runs with "authz": true and "trustProxy": true (door.json here).
events {}

http {
  upstream origin { server origin:8081; }
  upstream door { server door:8780; }

  server {
    listen 8080;

    location / {
      auth_request /_agent_custody;
      auth_request_set $custody_receipt $upstream_http_x_agent_custody_receipt;
      auth_request_set $custody_class $upstream_http_x_agent_custody_class;

      # the client is told which receipt recorded the decision, on an allow and on a refusal
      add_header X-Agent-Custody-Receipt $custody_receipt always;
      add_header X-Agent-Custody-Class $custody_class always;

      # the origin gets the door's receipt id and class, never values the client wrote in those headers
      proxy_set_header X-Agent-Custody-Receipt $custody_receipt;
      proxy_set_header X-Agent-Custody-Class $custody_class;
      # the grant and the declared name are for the door, not the origin
      proxy_set_header X-Agent-Custody-Grant "";
      proxy_set_header X-Agent-Custody-Agent "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://origin;
    }

    location = /_agent_custody {
      internal;
      # the door decides on the original request: these two headers, set here, never the client's own copies
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URI $request_uri;
      # the door takes the last address in X-Forwarded-For as the arrival's; set it, never append to the client's
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_pass http://door;
    }
  }
}
