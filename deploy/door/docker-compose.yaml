# The door answering authz checks for stock nginx (--profile nginx) or stock Envoy (--profile envoy), in front of a
# stand-in origin. demo.sh runs both and verifies the receipts; it sets DOOR_WORK (keys, receipts, log) and DOOR_USER.
# The door runs the CLI from this checkout (bun install at the root first); a deployment runs the published package.
# Only the proxy is published, on loopback: the door answers anyone who reaches it, so it stays on the internal network.
services:
  origin:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    command: ["node", "/srv/origin.mjs"]
    volumes:
      - ./origin.mjs:/srv/origin.mjs:ro

  door:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    user: "${DOOR_USER:-1000:1000}"
    command: ["node", "/app/packages/receipts/src/cli.ts", "door", "--config", "/etc/door/door.json", "--host", "0.0.0.0", "--port", "8780"]
    volumes:
      - ../..:/app:ro
      - ./door.json:/etc/door/door.json:ro
      - ./policy.cedar:/etc/door/policy.cedar:ro
      - ${DOOR_WORK:?set DOOR_WORK to a directory holding keys/door.key and keys/principal.pub}:/work

  nginx:
    profiles: ["nginx"]
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${DOOR_PROXY_PORT:-8088}:8080"
    depends_on: [door, origin]

  envoy:
    profiles: ["envoy"]
    image: envoyproxy/envoy:v1.40.2@sha256:8de97e654644827d62afdbf7e1d3dc9fee01a8690d410dd1c63a30dc6b6cecbb
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:${DOOR_PROXY_PORT:-8088}:8080"
    depends_on: [door, origin]
